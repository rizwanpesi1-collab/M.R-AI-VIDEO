<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizwan AI - Text to Video Generator</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_ID" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0a0a1a; --bg2:#1a1a3a; --card:#15152a; 
  --blue:#00d4ff; --purple:#a855f7; --text:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);font-family:'Poppins',sans-serif;min-height:100vh
}
header{text-align:center;padding:30px 10px}
.logo{font-size:36px;font-weight:700;background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-family:'Noto Nastaliq Urdu',serif;font-size:20px;margin-top:8px;color:#ccc}
.ad-box{max-width:728px;margin:15px auto;min-height:90px;background:var(--card);border-radius:12px;border:1px solid #222;display:flex;align-items:center;justify-content:center}
.container{max-width:750px;margin:20px auto;background:rgba(21,21,42,0.8);backdrop-filter:blur(10px);padding:30px;border-radius:20px;border:1px solid #333;box-shadow:0 0 30px rgba(0,212,255,0.1)}
h2{text-align:center;margin-bottom:15px;font-size:24px}
.urdu-text{text-align:center;font-family:'Noto Nastaliq Urdu',serif;font-size:18px;color:#aaa;margin-bottom:20px}
textarea{
  width:100%;height:130px;background:#0a0a1a;border:2px solid #333;
  color:#fff;padding:18px;border-radius:12px;font-size:16px;margin-bottom:15px;resize:none;outline:none
}
textarea:focus{border-color:var(--blue)}
.btn{
  width:100%;padding:18px;background:linear-gradient(90deg,var(--blue),var(--purple));
  border:none;color:#fff;font-size:20px;font-weight:700;border-radius:14px;cursor:pointer;
  transition:0.3s;box-shadow:0 5px 20px rgba(0,212,255,0.3)
}
.btn:hover{transform:scale(1.02)}
.btn:disabled{background:#333;box-shadow:none}
#result{margin-top:25px;text-align:center}
#result video{width:100%;border-radius:15px;margin-top:15px;border:2px solid var(--blue)}
.loader{color:var(--blue);font-size:18px}
.examples{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:15px 0}
.tag{padding:8px 14px;background:#222;border:1px solid #444;border-radius:20px;font-size:13px;cursor:pointer}
.tag:hover{background:var(--blue);color:#000}
footer{text-align:center;padding:20px;color:#666;font-size:13px}
</style>
</head>
<body>

<header>
  <div class="logo">🤖 رضوان اے RIZWAN AI</div>
  <div class="subtitle">متن سے ویڈیو بنائیں - بالکل مفت</div>
</header>

<!-- Ad Top -->
<div class="ad-box">
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-YOUR_ID" data-ad-slot="111" data-ad-format="auto"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<div class="container">
  <h2>Text to AI Video</h2>
  <p class="urdu-text">جو بھی سوچو، لکھو اور ویڈیو بنا لو</p>
  
  <div class="examples">
    <div class="tag" onclick="setPrompt('Pakistan flag waving in wind')">🇵🇰 Pakistan Flag</div>
    <div class="tag" onclick="setPrompt('cinematic drone shot of mountains')">🏔️ Mountains</div>
    <div class="tag" onclick="setPrompt('cute cartoon cat dancing')">🐱 Cartoon</div>
  </div>

  <textarea id="prompt" placeholder="یہاں اپنا آئیڈیا لکھیں... مثال: A beautiful sunset on beach"></textarea>
  <button id="btn" class="btn" onclick="makeVideo()">🚀 Generate Video Now</button>
  <div id="result"><p style="margin-top:15px;color:#888">آپ کی ویڈیو یہاں بنے گی</p></div>
</div>

<!-- Ad Bottom -->
<div class="ad-box">
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-YOUR_ID" data-ad-slot="222222" data-ad-format="auto"></ins>
<script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>

<footer>© 2026 Rizwan AI. Made with ❤️ in Pakistan</footer>

<script>
function setPrompt(text){document.getElementById('prompt').value = text;}

async function makeVideo(){
  let p = document.getElementById('prompt').value;
  let btn = document.getElementById('btn');
  if(p==""){alert("پہلے پرامپٹ لکھیں بھائی"); return;}
  
  btn.disabled = true;
  btn.innerText = "⏳ ویڈیو بن رہی ہے... 40 سیکنڈ";
  document.getElementById('result').innerHTML = '<p class="loader">برائے مہربانی ویٹ کریں...</p>';
  
  let url = `https://image.pollinations.ai/prompt/` + encodeURIComponent(p + " video, 5 seconds, cinematic") + `?nologo=true`;
  setTimeout(() => {
    document.getElementById('result').innerHTML = `
      <p style="color:#00ff88;font-size:18px">✅ ویڈیو تیار ہے!</p>
      <video controls autoplay src="${url}"></video>
      <a href="${url}" download class="btn" style="display:inline-block;margin-top:15px;text-decoration:none">📥 Download Video</a>
    `;
    btn.disabled = false;
    btn.innerText = "🚀 Generate Video Now";
  }, 40000);
}
</script>
</body>
</html>
